name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-map-engine-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-map-engine-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs scripts/release.test.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:code
      - run: npm test
      - run: npm run build
      - run: npm run verify:packages
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, verify, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
